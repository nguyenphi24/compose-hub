name: composehub

services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSEHUB_DATA_PATH:-./data}:/app/data
    ports:
      - "127.0.0.1:${COMPOSEHUB_API_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${COMPOSEHUB_PORT:-5173}:80"
